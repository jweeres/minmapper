[project]
name = "mie1603-project"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "jingng", email = "jin.gong@mail.utoronto.ca" }
]
dependencies = [
    "jupyter>=1.1.1",
    "gurobipy>=12.0.1",
    "networkx>=3.4.2",
    "matplotlib>=3.10.1",
    "osmnx>=2.0.1",
    "pandas>=2.2.3",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mie1603_project"]
